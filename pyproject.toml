[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gps-io-sensitivity"
version = "0.1.0"
description = "Reproducible input-output sensitivity analysis for GPS disruption"
readme = "README.md"
authors = [{name = "Saisha Doma"}]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
reproduce-gps-io = "scripts.reproduce:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gps_io*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
